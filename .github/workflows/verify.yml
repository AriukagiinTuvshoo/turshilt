name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint & Accessibility checks
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm test
      - name: Set non-production API base for CI build
        run: echo "NEXT_PUBLIC_API_BASE_URL=https://ci.invalid/api/v1" >> "$GITHUB_ENV"
      - name: Next.js production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guulingiinhan_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d guulingiinhan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/guulingiinhan_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --locked --dev
        working-directory: backend
      - name: Run pytest
        run: uv run pytest
        working-directory: backend
      - name: Run Ruff
        run: uv run ruff check app tests migrations scripts
        working-directory: backend
      - name: Run Mypy
        run: uv run mypy app
        working-directory: backend
      - name: Verify OpenAPI TypeScript Contract
        run: uv run python scripts/verify_api_contract.py
        working-directory: backend
      - name: Alembic upgrade
        run: uv run alembic upgrade head
        working-directory: backend
      - name: Alembic downgrade one revision
        run: uv run alembic downgrade -1
        working-directory: backend
      - name: Alembic upgrade again
        run: uv run alembic upgrade head
        working-directory: backend
      - name: Alembic consistency check
        run: uv run alembic check
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guulingiinhan_e2e
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d guulingiinhan_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/guulingiinhan_e2e
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: test_user
      PGPASSWORD: test_password
      PGDATABASE: guulingiinhan_e2e
      BACKUP_DIR: /tmp/guulin_ci_backups
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install frontend dependencies & Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install backend dependencies & migrate PostgreSQL
        working-directory: backend
        run: |
          uv sync --locked --dev
          uv run alembic upgrade head
      - name: Run PostgreSQL pg_dump & isolated restore drill
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          sh scripts/pg-backup.sh
          sh scripts/pg-restore-drill.sh
      - name: Build Next.js for E2E
        run: npm run build
      - name: Start servers, check /metrics, and run Playwright E2E tests
        run: |
          (cd backend && uv run uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          BACKEND_PID=$!
          npm run start -- --port 3000 &
          FRONTEND_PID=$!
          trap "kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ >/dev/null && curl -sf http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/metrics | grep -q guulin_http_requests_total
          npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
