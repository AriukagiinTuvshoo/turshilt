services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guulingiinhan}
      POSTGRES_USER: ${POSTGRES_USER:-guulingiinhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guulingiinhan} -d ${POSTGRES_DB:-guulingiinhan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      APP_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in environment}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  maintenance:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - "while true; do uv run python scripts/run_maintenance.py --json || true; sleep 86400; done"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-guulingiinhan}
      PGUSER: ${POSTGRES_USER:-guulingiinhan}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - 'while true; do sh /scripts/pg-backup.sh || true; sleep "${BACKUP_INTERVAL_SECONDS:-86400}"; done'

volumes:
  postgres_data:
  postgres_backups:
